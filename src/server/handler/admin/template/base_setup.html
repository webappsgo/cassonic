{{define "base_setup"}}<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --surface: #1e2130;
      --border: #2e3250;
      --accent: #5b8af8;
      --accent-hover: #7aa3ff;
      --text: #e0e4f0;
      --text-muted: #8891b0;
      --danger: #e05252;
      --success: #4caf7d;
    }
    body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; font-size: 15px; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .setup-card { width: 100%; max-width: 480px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 32px; }
    .setup-card h1 { font-size: 20px; margin-bottom: 4px; }
    .setup-card .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
    .steps { display: flex; gap: 6px; margin-bottom: 24px; }
    .steps span { flex: 1; height: 4px; border-radius: 2px; background: var(--border); }
    .steps span.done, .steps span.active { background: var(--accent); }
    .form-field { margin-bottom: 16px; }
    .form-field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
    .form-field input, .form-field select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 9px 10px; font-size: 14px; }
    .form-field input:focus, .form-field select:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
    .form-field small { display: block; color: var(--text-muted); font-size: 11px; margin-top: 4px; }
    .checkbox-field { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .checkbox-field input { width: auto; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; width: 100%; transition: background 0.15s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; background: rgba(224,82,82,0.12); border: 1px solid var(--danger); color: var(--danger); font-size: 13px; }
    .token-box { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-family: monospace; font-size: 13px; word-break: break-all; margin-bottom: 8px; }
    .token-warning { color: var(--danger); font-size: 12px; font-weight: 600; margin-bottom: 16px; }
  </style>
</head>
<body>
  <main class="setup-card">
    {{template "content" .}}
  </main>
</body>
</html>{{end}}
